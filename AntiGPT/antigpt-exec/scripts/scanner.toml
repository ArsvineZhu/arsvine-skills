version = 1

[scanner]
text_extensions = [
    ".adoc",
    ".bash",
    ".c",
    ".cc",
    ".cjs",
    ".cpp",
    ".css",
    ".fish",
    ".go",
    ".h",
    ".hpp",
    ".html",
    ".java",
    ".js",
    ".json",
    ".jsonc",
    ".jsx",
    ".kt",
    ".kts",
    ".less",
    ".md",
    ".mdx",
    ".mjs",
    ".proto",
    ".ps1",
    ".py",
    ".pyi",
    ".rs",
    ".rst",
    ".scss",
    ".sh",
    ".sql",
    ".svelte",
    ".swift",
    ".toml",
    ".ts",
    ".tsx",
    ".txt",
    ".vue",
    ".xml",
    ".yaml",
    ".yml",
    ".zsh",
]
skip_dirs = [
    ".cache",
    ".git",
    ".idea",
    ".next",
    ".nuxt",
    ".pytest_cache",
    ".turbo",
    ".venv",
    ".vscode",
    "build",
    "coverage",
    "dist",
    "node_modules",
    "target",
    "vendor",
    "venv",
]
skip_globs = [
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "**/yarn.lock",
    "**/Cargo.lock",
    "**/go.sum",
    "**/poetry.lock",
]
allow_markers = ["agency-scan: allow", "defensive-scan: allow"]

[[patterns]]
key = "subjectivization-zh"
severity = "medium"
regex = "(?:我认为|我觉得|我倾向于?|在我看来|我的倾向是)"
ignore_case = false
note = "Check whether speaker identity adds information or only weakens a judgment."

[[patterns]]
key = "subjectivization-en"
severity = "medium"
regex = "\\b(?:I think|I believe|I(?:'|’)d lean toward|I lean toward|in my view|my preference is)\\b"
ignore_case = true
note = "Check whether speaker identity adds information or only weakens a judgment."

[[patterns]]
key = "commitment-weakening-zh"
severity = "medium"
regex = "(?:可以考虑|不妨考虑|可能更(?:合适|合理|好)|或许更(?:合适|合理|好)|建议可以)"
ignore_case = false
note = "Check whether a settled choice has been rewritten as an option or possibility."

[[patterns]]
key = "commitment-weakening-en"
severity = "medium"
regex = "\\b(?:could consider|might consider|may want to consider|could perhaps|might perhaps|probably the better option)\\b"
ignore_case = true
note = "Check whether a settled choice has been rewritten as an option or possibility."

[[patterns]]
key = "automaticity-framing-zh"
severity = "medium"
regex = "(?:天然(?:会|成为|导致|意味着|带来)|自然(?:会|地会|成为|导致|意味着)|自动(?:会|成为|导致|意味着))"
ignore_case = false
note = "Check whether automaticity was asserted where the reasoning only supports a contingent tendency or direct judgment."

[[patterns]]
key = "automaticity-framing-en"
severity = "medium"
regex = "\\b(?:naturally|inherently|automatically)\\s+(?:becomes?|means?|implies?|leads?\\s+to|creates?|produces?)\\b"
ignore_case = true
note = "Check whether automaticity was asserted where the reasoning only supports a contingent tendency or direct judgment."

[[patterns]]
key = "defensive-negation-zh"
severity = "high"
regex = "(?:不自动(?:意味着|代表|说明)|并不意味着|并不代表|不能证明|不足以(?:证明|说明)|单凭.{0,24}(?:不能|不足以)|这并不意味着|这不代表)"
ignore_case = false
note = "Check whether the text invented a stronger claim and then negated it."

[[patterns]]
key = "negation-marker-zh"
severity = "low"
regex = "不"
ignore_case = false
note = "A Chinese negation marker occurs here. Review the full sentence for defensive framing; the marker alone does not establish a problem."
broad_negation = true

[[patterns]]
key = "defensive-negation-en"
severity = "high"
regex = "\\b(?:does not automatically (?:mean|imply|prove)|doesn't automatically (?:mean|imply|prove)|does not necessarily (?:mean|imply|prove)|doesn't necessarily (?:mean|imply|prove)|does not prove|doesn't prove|cannot prove|this does not mean|this doesn't mean)\\b"
ignore_case = true
note = "Check whether the text invented a stronger claim and then negated it."

[[patterns]]
key = "invented-contrast-zh"
severity = "high"
regex = "(?:不是.{0,60}而是|并非.{0,60}而是|并不是.{0,60}而是)"
ignore_case = false
note = "Check whether the contrast answers a real distinction or a model-invented objection."

[[patterns]]
key = "invented-contrast-en"
severity = "high"
regex = "\\bnot\\s+.{1,80}\\s+but\\s+"
ignore_case = true
note = "Check whether the contrast answers a real distinction or a model-invented objection."

[[patterns]]
key = "research-deferral-zh"
severity = "high"
regex = "(?:需要进一步(?:研究|验证|调查|确认)|还需要进一步(?:研究|验证|调查|确认)|有待进一步(?:研究|验证|调查|确认))"
ignore_case = false
note = "Require a concrete decision that the proposed extra research can change."

[[patterns]]
key = "research-deferral-en"
severity = "high"
regex = "\\b(?:requires further (?:research|validation|investigation)|needs further (?:research|validation|investigation)|more research is needed|further investigation is needed)\\b"
ignore_case = true
note = "Require a concrete decision that the proposed extra research can change."

[[patterns]]
key = "hypothetical-defeater-zh"
severity = "medium"
regex = "(?:潜在(?:的)?外部(?:调用方|消费者|依赖)|未来可能(?:存在|出现)|理论上可能(?:存在|出现)|无法排除.{0,40}可能)"
ignore_case = false
note = "Check whether an unobserved defeater has enough evidence or consequence to affect the decision."

[[patterns]]
key = "hypothetical-defeater-en"
severity = "medium"
regex = "\\b(?:potential external consumers?|future consumers? may|there may be unknown consumers?|cannot rule out the possibility)\\b"
ignore_case = true
note = "Check whether an unobserved defeater has enough evidence or consequence to affect the decision."

[[patterns]]
key = "safety-preface-zh"
severity = "low"
regex = "(?:为了稳妥起见|为(?:了)?安全起见|谨慎起见|保险起见)"
ignore_case = false
note = "Check whether caution has a concrete risk basis and changes the action."

[[patterns]]
key = "safety-preface-en"
severity = "low"
regex = "\\b(?:to be safe|for safety's sake|to err on the side of caution|out of an abundance of caution)\\b"
ignore_case = true
note = "Check whether caution has a concrete risk basis and changes the action."

[[patterns]]
key = "negation-marker-en"
severity = "low"
regex = "\\b(?:not|no|never|none|nothing|nobody|nowhere|neither|nor|without|cannot|\\w+n['’]t)\\b"
ignore_case = true
note = "An English negation marker occurs here. Review the full sentence for defensive framing; the marker alone does not establish a problem."
broad_negation = true
