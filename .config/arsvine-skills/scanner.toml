version = 2

[scanner]
prose_extensions = [".md", ".mdx", ".rst", ".adoc", ".txt"]
code_extensions = [".py", ".pyi", ".js", ".jsx", ".ts", ".tsx", ".mjs", ".cjs", ".rs", ".go", ".java", ".kt", ".kts", ".swift", ".sh", ".bash", ".zsh", ".fish", ".ps1", ".toml", ".yaml", ".yml", ".json", ".jsonc", ".xml", ".html", ".css", ".scss", ".less", ".sql", ".proto", ".c", ".cc", ".cpp", ".h", ".hpp"]
skip_dirs = [".git", ".cache", ".idea", ".next", ".nuxt", ".pytest_cache", ".turbo", ".venv", ".vscode", "build", "coverage", "dist", "node_modules", "target", "vendor", "venv"]
skip_globs = ["**/package-lock.json", "**/pnpm-lock.yaml", "**/yarn.lock", "**/Cargo.lock", "**/go.sum", "**/poetry.lock"]

# Blocks are narrow review gates for retrospective cancellation and self-defensive reframing.
# General contrasts, logical limitations, and process cues need contextual review; isolated caution is a signal.
# Quoted teaching examples use named waivers rather than automatic exemptions.

[[patterns]]
key = "invented-contrast-zh"
class = "review"
regex = "(?:不是|并非|并不是)[^。！？；\\n]{0,80}?而是"
ignore_case = false
note = "Keep a contrast when it resolves a live distinction; otherwise state the positive proposition."

[[patterns]]
key = "invented-contrast-en"
class = "review"
regex = "\\bnot\\s+(?!only\\b)[^.!?;\\n]{1,100}?\\s+but\\s+"
ignore_case = true
note = "Keep a contrast when it resolves a live distinction; otherwise state the positive proposition."

[[patterns]]
key = "defensive-negation-zh"
class = "block"
regex = "(?:这(?:个结论|个结果|一结果)?(?:并)?不(?:自动|必然)?(?:意味着|代表|说明)|并不意味着|不自动(?:意味着|代表|说明))"
ignore_case = false
note = "Check the actual claim being limited. Remove an invented stronger claim, or waive this rule with the live inference being corrected."

[[patterns]]
key = "defensive-negation-en"
class = "block"
regex = "\\b(?:this|that|it)\\s+(?:does not|doesn't|doesn’t|did not|didn't|didn’t)\\s+(?:(?:automatically|necessarily)\\s+)?(?:mean|imply|prove)\\b"
ignore_case = true
note = "Check the actual claim being limited. Remove an invented stronger claim, or waive this rule with the live inference being corrected."

[[patterns]]
key = "subjectivization-zh"
class = "review"
regex = "(?:我认为|我觉得|我倾向于?|在我看来|我的倾向是)"
ignore_case = false
note = "Speaker identity should add information, not soften a technical judgment."

[[patterns]]
key = "subjectivization-en"
class = "review"
regex = "\\b(?:I think|I believe|I(?: would|'d|’d)? lean (?:toward|towards)|in my view|my preference is)\\b"
ignore_case = true
note = "State a supported judgment directly. Keep first person for a real preference, action, or access limitation."

[[patterns]]
key = "commitment-weakening-zh"
class = "review"
regex = "(?:可以考虑|不妨考虑|可能更(?:合适|合理|好)|或许更(?:合适|合理|好)|建议可以)"
ignore_case = false
note = "Check whether a settled action was rewritten as a preference or possibility."

[[patterns]]
key = "commitment-weakening-en"
class = "review"
regex = "\\b(?:could consider|might consider|may want to consider|could perhaps|might perhaps|may perhaps|probably the better option|may be more suitable)\\b"
ignore_case = true
note = "Restore the decided action when this wording weakens an established conclusion; keep genuine uncertainty local."

[[patterns]]
key = "research-deferral-zh"
class = "review"
regex = "(?:需要进一步(?:研究|验证|调查|确认)|还需要进一步(?:研究|验证|调查|确认)|有待进一步(?:研究|验证|调查|确认))"
ignore_case = false
note = "Name the decision, model, implementation, or validation strategy that the extra work can change."

[[patterns]]
key = "research-deferral-en"
class = "review"
regex = "\\b(?:requires further (?:research|validation|investigation)|needs further (?:research|validation|investigation)|more research is needed|further investigation is needed)\\b"
ignore_case = true
note = "Name the decision, model, implementation, or validation strategy that the extra work can change."

[[patterns]]
key = "hypothetical-defeater-zh"
class = "review"
regex = "(?:潜在(?:的)?外部(?:调用方|消费者|依赖)|未来可能(?:存在|出现)|理论上可能(?:存在|出现)|无法排除.{0,40}可能)"
ignore_case = false
note = "Require evidence, consequence, or an explicit obligation before an unobserved defeater changes the action."

[[patterns]]
key = "hypothetical-defeater-en"
class = "review"
regex = "\\b(?:potential external consumers?|future consumers? may|there may be unknown consumers?|cannot rule out the possibility)\\b"
ignore_case = true
note = "Require evidence, consequence, or an explicit obligation before an unobserved defeater changes the action."

[[patterns]]
key = "safety-preface-zh"
class = "signal"
regex = "(?:为了稳妥起见|为(?:了)?安全起见|谨慎起见|保险起见)"
ignore_case = false
note = "Check whether the caution changes action under a concrete risk."

[[patterns]]
key = "safety-preface-en"
class = "signal"
regex = "\\b(?:to be safe|for safety's sake|to err on the side of caution|out of an abundance of caution)\\b"
ignore_case = true
note = "Check whether the caution changes action under a concrete risk."

[[patterns]]
key = "logical-limitation-en"
class = "review"
regex = "\\b(?:(?:cannot|can't|can’t)\\s+(?:prove|guarantee|show)|(?:does not|doesn't|doesn’t|did not|didn't|didn’t)\\s+(?:(?:automatically|necessarily)\\s+)?(?:mean|imply|prove|guarantee)|(?:is not|isn't|isn’t)\\s+equivalent to)\\b"
ignore_case = true
note = "Keep a logical limitation when it changes the conclusion or action; identify the specific remaining uncertainty."

[[patterns]]
key = "logical-limitation-zh"
class = "review"
regex = "(?:不能(?:证明|保证|说明)|不代表|不等于|不足以(?:判断|证明)|无法保证)"
ignore_case = false
note = "Keep a logical limitation when it changes the conclusion or action; identify the specific remaining uncertainty."

[[patterns]]
key = "trailing-limitation-zh"
class = "review"
regex = "[，,；;]\\s*不把[^。！？；;\\n]{0,60}(?:视为|当作|归因于|解释为|说成|等同于|称为)"
ignore_case = false
note = "Inspect whether this trailing clause answers a real distinction or rebuts a claim the reader never made. Preserve necessary factual limits."

[[patterns]]
key = "self-defensive-reframing-en"
class = "block"
regex = "\\b(?:this|that|it)\\s+(?:is not|isn't|isn’t)\\s+(?:a\\s+)?(?:rejection|dismissal|denial|criticism|argument against)[^.!?;]{0,100}(?:;?\\s*(?:but|rather|instead|it (?:simply|just) means))"
ignore_case = true
note = "State the substantive result directly. If answering a real objection, name it in a local waiver."

[[patterns]]
key = "self-defensive-reframing-zh"
class = "block"
regex = "(?:这|这里)(?:并)?不是(?:在)?(?:否定|反对|拒绝|批评)[^。！？]{0,80}?(?:而是|只是)"
ignore_case = false
note = "State the substantive result directly. If answering a real objection, name it in a local waiver."

[[patterns]]
key = "preservation-pretext-en"
class = "review"
regex = "(?<!not )(?<!never )(?<!n't )(?<!n’t )\\b(?:preserve|retain|keep)[^.!?;]{0,100}\\b(?:adapter|shim|wrapper|old (?:API|interface)|duplicate(?:d)? implementation)[^.!?;]{0,100}\\b(?:avoid (?:changing|breaking) (?:existing )?tests|minimi[sz]e (?:the )?(?:diff|changes)|just in case)\\b"
ignore_case = true
note = "Check the real compatibility obligation. Change obsolete tests or structure at their owner instead of retaining a second implementation for local convenience."

[[patterns]]
key = "preservation-pretext-zh"
class = "review"
regex = "(?<!不要)(?<!不应)(?<!禁止)(?:(?:为了?(?:保持|保证)?最小(?:改动|修改)|为了?避免(?:修改|破坏)(?:现有|已有)?测试)[^。！？]{0,80}(?:保留|维持|兼容)|(?:保留|维持)[^。！？]{0,60}(?:适配器|兼容层|旧接口|重复实现)[^。！？]{0,60}(?:避免(?:修改|破坏)测试|最小改动|以防万一))"
ignore_case = false
note = "Check the real compatibility obligation. Change obsolete tests or structure at their owner instead of retaining a second implementation for local convenience."

[[patterns]]
key = "process-substitution-en"
class = "review"
regex = "(?<!not )(?<!never )(?<!n't )(?<!n’t )\\b(?:first|must|required to)[^.!?;]{0,60}\\b(?:create|produce|complete|prepare|build)\\b[^.!?;]{0,60}\\b(?:evidence package|risk matrix|checklist|verification matrix|proof dossier)\\b[^.!?;]{0,100}\\bbefore\\b"
ignore_case = true
note = "Tie the proposed prerequisite to a concrete decision or obligation. Implement the agreed outcome when the extra artifact would not change it."

[[patterns]]
key = "process-substitution-zh"
class = "review"
regex = "(?:必须|需要先|首先)[^。！？]{0,40}(?:建立|创建|完成|准备|列出|整理)[^。！？]{0,40}(?:证据包|风险矩阵|检查清单|验收矩阵)[^。！？]{0,60}(?:再|才能|之前)"
ignore_case = false
note = "Tie the proposed prerequisite to a concrete decision or obligation. Implement the agreed outcome when the extra artifact would not change it."

[[patterns]]
key = "correction-memorial-en"
class = "review"
regex = "\\b(?:the (?:old|previous) (?:error|mistake)|(?:incorrect|removed|deleted) (?:content|section|item))\\s+(?:is|has been)\\s+(?:now |still )?(?:gone|absent|removed|no longer present)|\\b(?:now|still)\\s+(?:contains? no|free of)\\s+(?:the )?(?:old|previous)\\s+(?:error|mistake)\\b"
ignore_case = true
note = "Keep the corrected content in its owning section. Retain correction history only when it serves a real changelog or migration need."

[[patterns]]
key = "correction-memorial-zh"
class = "review"
regex = "(?:旧|原来|此前|之前)(?:的)?(?:错误|错误内容)[^。！？]{0,15}(?:已经|已|现在)(?:被)?(?:删除|移除|不存在)|(?:现在|目前)(?:已经)?没有(?:之前|原来|旧)(?:的)?错误"
ignore_case = false
note = "Keep the corrected content in its owning section. Retain correction history only when it serves a real changelog or migration need."

# In operational AI instructions, address the agent with an action rather than
# explaining how the instructions protect it from its own tendencies.

[[patterns]]
key = "indirect-agent-instruction-en"
class = "review"
scope = "ai"
regex = "\\b(?:prevent|stop|keep|discourage)\\s+(?:the\\s+|an?\\s+)?(?:coding\\s+)?agents?\\s+from\\b"
ignore_case = true
note = "Address the agent directly; write the required action as an imperative."

[[patterns]]
key = "policy-self-description-en"
class = "review"
scope = "ai"
regex = "\\bthis\\s+(?:skill|constitution|instruction|rule|document)\\s+(?:aims\\s+to|seeks\\s+to|helps\\s+to|prevents?)\\b"
ignore_case = true
note = "Replace an account of the policy's purpose with the action required of the reader."
