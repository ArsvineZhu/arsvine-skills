[project]
name = "arsvine-skills"
version = "0"
requires-python = ">=3.11"
description = "AntiRLHF bundle and independent Skills"

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["dist", "build", "AntiRLHF/archive"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501", "E702"]
